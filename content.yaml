title: Atonement Theory Family Tree
nodes:
- id: ORIGEN
  camp: ransom
  node:
    title: Origen · Commentary on Matthew (3rd century)
    desc:
    - Ransom Theory
  card:
    title: Origen · Commentary on Matthew
    meta: 3rd century
    headline: Ransom Theory
    problem: |-
      The devil owns the souls of men.
    solution: |-
      Jesus paid the ransom to the devil to free men.
    opens: |-
      Gives the devil power over God -- something that Anselm would address later.
    notes: |-
      Origen, notably, was a universalist. He believed that the ransom paid covered the whole of the human race.

      The need for satisfaction (in this case to the devil) in order to achieve man's rescue is the seed he planted that would later develop into what we know as penal substitutionary atonement.
- id: IRE
  camp: onto
  node:
    title: Irenaeus · Against Heresies (~180 AD)
    desc:
      - Reads mortality as mercy, not sentence
  card:
    title: Irenaeus
    meta: Against Heresies, 180 AD.
    headline: Reads mortality as mercy, not sentence
    problem: |-
      Against Heresies was written to explicitly provide a rebuttal to the gnostic heresies (especially Valentinian heresy) circulating at the time. Indeed, the beginning of the book starts with an exposition of exactly what the gnostic heresy is, and to modern theologians, their view is just plain weird and generally pantheistic. 

      In reference to penal substitution, Genesis 3 is the retributive reader's strongest ground. If death is the penalty imposed for sin, then the expulsion from Eden is God's first punitive act, and every ontological account of the atonement has to explain away the one scene where God plainly does something to man. But the penal reading has to ignore the reason the text itself gives for the expulsion: man is driven out lest he reach for the tree of life and live forever.

      It's notable to me that the seed of PSA really does hinge in many ways on the single question of whether the expulsion from the garden was retributive or restorative. If one chooses to view it as retributive, then death is by definition imposed externally from God as a punishment. If it's restorative, then death is a grace of God to prevent remaining eternally in a corrupted state.
    solution: |-
      Irenaeus takes the exile as an act of pity. Barred from the tree, man does not become immortal in his corruption; God interposes death so that sin is not endless and the evil not irremediable, setting a term to the disease rather than exacting a price for it. The expulsion is therefore continuous with the cure rather than opposed to it — mortality is what keeps the wound from becoming permanent, and death becomes the condition under which the remedy can reach us. Christ then recapitulates the life man forfeited, passing through every stage of it and restoring from within what Adam lost. The guarded tree is reopened, not replaced.
    opens: |-
      Mortality as mercy requires an Adam who was never immortal by nature — created immature, made to grow, holding incorruption only as gift. That forecloses the Augustinian originally-immortal Adam whose death is purely penal, and buys a developmental anthropology the later West largely abandoned. It also presses downstream: if unending life in corruption is precisely the state God acted to prevent, then eternal conscious punishment restores the condition the exile was meant to foreclose.
    notes: |-
      This supplies the piece Athanasius leaves underspecified. A pure natural-consequence reading of death risks making God a bystander at the one moment Genesis has him acting; Irenaeus gives a divine act that is agentive without being retributive, which is exactly the shape I need.

      Adv. Haer. III.23.6 is the citation — banished out of pity, so that man would not remain a sinner forever and the evil not be interminable. The same move recurs in Theophilus (Ad Autolycum II.26), Nazianzen (Or. 45.8, the tree withheld not from envy but so that evil not become immortal), and Nyssa Cat. Or. 8, mortality as therapy). It is a mainstream patristic reading, not a workaround.

      Note the load-bearing device: nature/grace. It carries the asymmetry of the will (able to break what it cannot mend), the loss of ontological stability, and now the exile itself. Progressive rather than immunizing, since it does independent work in each place — but the concentration is worth watching.
- id: ANSELM
  camp: satisfaction
  node:
    title: Anselm · Cur Deus Homo (1098)
    desc:
    - Satisfaction Theory
  card:
    title: Anselm · Cur Deus Homo
    meta: '1098'
    headline: Satisfaction Theory
    problem: |-
      Ransom theory has God paying a ransom to the devil, which Anselm felt was intolerable. The devil has no rights against God.
    solution: |-
      His solution was satisfaction theory built on feudal honor. Humans have, by their sin, incurred a debt against God's honor, which must be repaid to be satisfied. Man cannot afford to pay, so his punishment is infinite by nature, due to the infinite honor of God. Christ alone, being sinless, is able to repay the debt, and he provides an offering of infinite value and thus repaying the debt.
    opens: |-
      The problem of guilt is still unsolved. Christ's death, is offered instead of punishment, but not as punishment. Nothing in satisfaction theory explains how the penalty is applied to the believer--a gaping hole that Calvin would drive through a few hundred years later.
    notes: |-
      In satisfaction theory, the stated assumption is that God cannot merely waive the debt owed by man. This introduces what I would consider to be a contingent necessity on the part of God--forcing God's hand. It gives mankind a weird kind of control over the actions of God. Man's sin has a deterministic effect upon the actions of God, thus controlling God--even if tha control is destructive to man. 
      
      Further development would try to hide the necessity. Owen's Dissertation on Divine Justice moves it from the will of God (where it's not strictly necessary) into the character of God, so that God is bound to respond. Turretin tries to remove the potentiality this creates within the character of God by further subdividing the concept of an attribute into two parts--habitus and actus--separating the disposition of God from his freedom of method in how he responds, but I claim he merely redefines the terms to relocate the offending concept that ultimately binds God's hand to retribution.

      It's also worth noting that Anselm's creditor-relocation to God puts God on both sides of the transaction, which means the theory can no longer deal in whole souls--how can God ransom a whole soul from himself? So the currency must also change. This is where Anselm brings in the debt/honor framework to answer this question--because we're no longer dealing in full souls, the new trading currency must be deontic properties or symbolic capital. It's worth noting that later developments would shift which deontic properties are the currency, as Calvin does in 1559, moving from debt and honor to sin and righteousness.
- id: ATH
  camp: onto
  node:
    title: Athanasius · On the Incarnation (4th c. AD)
    desc:
    - Recasts atonement as healing, not payment
  card:
    title: Athanasius
    meta: On the Incarnation, 4th c.
    headline: Recasts atonement as healing, not payment
    problem: |-
      If salvation is essentially a legal transaction, it never reaches the deeper human catastrophe: a nature that has turned from its source of life and is unravelling into corruption and death.
    solution: |-
      He frames atonement ontologically. The Word takes on mortal human nature and, by uniting it to his own imperishable life, heals and re-creates it from the inside — covering death with life rather than settling a penalty.
    opens: |-
      Locating salvation in the healing of nature leaves the legal and moral side underspecified — how guilt is answered and where God's justice and wrath fit — the very data the later Western tradition refuses to fold into ontology.
    notes: |-
      Athanasius is where I turned to to keep my faith after PSA broke down in my head. It's a beautiful answer to the problem, and I'm obviously a big fan of it. In it, he claims that man is moving towards non-being (death) by virtue of his sins, which cause corruption that leads to death. There's a strong thread here that death is the natural consequence of sin, and not a necessary consequence imposed externally by God as a response to sin (as is the case in PSA). 
      
      That said, I do have one minor quibble with Athanasius, and it's in his divine dilemma. The dilemma arguably pits the goodness of God to redeem his image-bearers against the truthfulness of God to hold true to the sentance of death. The trouble is in it's relocation of the consequence of death from the natural world to a necessity by virtue of truthfulness. In doing so, it claims that God is self-bound by his statement to render death unto his image-bearers.

      This is, to be sure, an inconsistency within Athanasius. Either sin leads to death inherently, or death is imposed externally, but it cannot be both at the same time. This ambiguity regarding the source of death can be seen as a microcosm of the same equation that Owen tries to balance in the 17th century.

      One other note, and that is on the nature of immortality in man. Modern views tend to presuppose the inherent immortality of man. Indeed, it's this presupposition of immortality that is required to explain eternal conscious torment (and why modern proponents of annihilation call their view "conditional immortality"). Athanasius and Irenaeus held that immortality was a superadded gift of God, dependent upon man's attendance thereto, and not something inherent to the creature. Their argument is that man turned away from the source of life, and by negation, introduced death and corruption into themselves, leading to eventual mortality. 
- id: LUTH
  camp: penal
  node:
    title: Luther · The Freedom of a Christian (1520)
    desc:
      - The joyous exchange
      - Alien righteousness through faith-union with Christ
      - Simul justis et peccator
  card:
    title: Luther · The Freedom of a Christian
    meta: 1520; cf. Lectures on Galatians, 1535
    headline: The joyous exchange
    problem: |-
      How can a sinner who never does enough penance, contrition, or merit have any certainty of standing right before God? The medieval penitential system ties assurance to the sufficiency of one's own ongoing disposition and works — a ledger the anxious conscience can never confirm is settled.
    solution: |-
      Faith unites the soul to Christ the way a bride is united to a bridegroom: what is his becomes hers, what is hers becomes his. Christ takes the soul's sin, death, and damnation as though they were his own; the soul receives his righteousness, life, and blessedness as though they were hers. Luther calls this the fröhliche Wechsel, the joyous exchange — grounded not in a legal transaction but in a real union effected by faith. Assurance no longer rests on the sinner's own supply of merit; it rests on Christ's, already given over in the marriage.
    opens: |-
      Is this a real sharing of possessions through union, or a legal fiction dressed up as a marriage? Luther never fully specifies the mechanism — which is exactly the gap Calvin will close by converting the marital metaphor into a juridical one (imputation as legal verdict rather than nuptial gift). It's also the gap Osiander will later exploit from the other side, reading Luther's "union" literally to argue for an essential, indwelling righteousness against Calvin's purely forensic one.
    notes: |-
      This is the actual fountainhead — Luther is where the sin/righteousness swap originates, a full generation before Calvin. But it's warmer and less exact than what Calvin will make of it: existential and marital rather than judicial. Luther will even say, in the Galatians lectures, that Christ became "the greatest sinner who ever was" by taking sin onto himself — hyperbolic, personal language, not yet the careful language of a courtroom verdict.

      Calvin inherits the exchange but re-houses it. Where Luther grounds the swap in the intimacy of the wedding ring (faith as what joins the parties), Calvin grounds it in the mechanics of a legal declaration (imputation as a judge's reckoning). Same two goods changing hands — sin out, righteousness in — but Luther's version answers "how can I be sure," and Calvin's answers "how can this be just."
- id: CALV
  camp: penal
  node:
    title: Calvin · Institutes (1559)
    desc:
      - The Reformed doctrine of satisfaction
        Imputation of righteousness
  card:
    title: Calvin · Institutes of the Christian Religion
    meta: definitive edition, 1559
    headline: The Reformed doctrine of satisfaction
    problem: |-
      How can a just and holy God forgive sinners without treating sin as though it didn't matter? Anselm had framed the answer around God's honor; the Reformers recast it around justice and God's wrath against sin.
    solution: |-
      Christ, standing in our place, bears the curse and the wrath our sin deserved — a real, objective, substitutionary satisfaction of divine justice — so that God can be at once just and the justifier of those who believe. This is the fountainhead of the penal-substitution stream.
    opens: |-
      It hands the critics their opening: if Christ fully bears the penalty in our place, is that forgiveness or merely payment — and can guilt be justly transferred to an innocent? Exactly the blades Socinus will press.
    notes: |-
      Calvin changes the deontic currency (deontic currency is a currency of metaphysical "stuff" like debt, honor, sin and forgiveness, but not of whole persons). Debt and honor are out. Sin and righteousness are in. Why?

      This is because Anselm's view was based on the feudal system of his time. For Anselm, sin disturbed the universe by withholding honor due to God. Satisfaction restores the order by repaying the debt. The category of honor, however, is negotiable, leading to the charge that God could simply waive the debt entirely and forgive anyways. Christ's death on the cross earns infinite merit because Jesus was fully innocent and didn't deserve to die, and his death restores the order that was lost by sin. Mankind, for his end, is not imputed any of this honor. The debt of man goes to zero because it's been paid by a third party (Jesus), but man has no righteousness in himself.

      This was problematic for Calvin. He viewed it as necessary that we have righteousness as well, because we will not enter the kingdom of God unless our righteousness surpasses that of the Pharisees.

      Debt/honor gets a settled account, but sin/righteousness enables a swapped verdict, and Calvin, to be consistent with Luther, needed the latter, emphasizing substitution over the satisfaction. 
- id: SOC
  camp: other
  node:
    title: Socinus · De Servatore (1578)
    desc:
    - Satisfaction and forgiveness are mutually exclusive opposites.
    - Retributive justice cannot be transferred.
  card:
    title: Faustus Socinus
    meta: De Jesu Christo Servatore, 1578
    headline: |-
      Satisfaction and forgiveness are mutually exclusive opposites. Retributive justice cannot be transferred.
    problem: |-
      Penal satisfaction struck him as self-cancelling: a debt paid in full is discharged, not forgiven, so grace vanishes — and punishing an innocent substitute for the guilty is itself unjust, since guilt can't be transferred.
    solution: |-
      He drops objective satisfaction entirely. God, who tells us to forgive freely, simply forgives the repentant; Christ saves as prophet and exemplar whose exaltation gives him power to bless. No payment is owed or made.
    opens: |-
      If the death accomplishes nothing objective, it becomes hard to say why the cross was needed at all; the atonement risks being morally inspiring but causally idle, and grace loses any costly ground.
    notes: |-
      Socinus was an odd bird and held to several very strange beliefs, many of which were heretical. For example, he denied the diety of Christ, but maintained that he should be worshipped. He held to an early form of open theism. So in that vein, he was hardly orthodox on many of his beliefs, so I would hesitate to emulate most of his theology.

      Nevertheless, this might be the single best rebuttal in the history of theology. I still don't think there's a good answer, but as a result of Socinus's rebuttal, Grotius and Kant jumped off the PSA bus entirely while Owen doubled down, and together with Turretin sought to find a sufficiently deep place to hide the retribution they'd accepted as a necessary premise.
- id: GRO
  camp: govt
  node:
    title: Grotius · Defensio (1617)
    desc:
    - Founds Governmental Theory
  card:
    title: Hugo Grotius
    meta: Defensio fidei catholicae, 1617
    headline: Founds the governmental theory
    problem: |-
      Socinus's dilemma only bites if God is a private creditor — but once you concede there's no strict payment, you seem pushed all the way to bare forgiveness, with nothing objective left for the cross to do.
    solution: |-
      He moves God from creditor to Ruler of a moral order. God may relax the strict penalty, yet stages Christ's death as a public demonstration upholding the law's authority — so he can pardon freely without sin looking trivial.
    opens: |-
      A demonstration that upholds the law's authority may not be a real satisfaction of justice at all — it looks like deterrent expediency that never touches anyone's specific guilt, and if the penalty can be relaxed, the bloody display starts to look superfluous.
- id: BAX
  camp: hybrid
  node:
    title: Baxter (1649)
    desc:
    - Universal in the making, particular in the applying
  card:
    title: Richard Baxter
    meta: Aphorismes of Justification, 1649
    headline: Universal in the making, particular in the applying
    problem: |-
      Owen's double-payment case for limited atonement only works if satisfaction behaves like money that auto-discharges the account — which flatly contradicts Owen's own penal model, where release is never automatic.
    solution: |-
      He splits the difference: the satisfaction is universal in the making but particular in the applying, applied by God as Rector on the condition of faith — so its scope isn't fixed mechanically by the payment itself.
    opens: |-
      Resting application on God's rectoral will plus the condition of faith reintroduces a conditional, governmental element that critics read as neonomian — dissolving the very definiteness Owen prized and pressing on whether faith becomes a work.
    notes: |-
      This view causes real anxiety. Here's how.

      Baxter was faced with two problems: antinomianism on one end, and an overly forensic theology on the other. He tries to split the difference by denying that Christ's death was a strict quantitative payment to satisfy God, but rather that it _generally_ satisfied the rectoral justice of God. This meant that Christ's death doesn't actually pay the penalty, but merely opens up the door for God to offer another more lenient deal. 

      The deal, then, was that the Gospel was the "new law" that depended on the sincere faith of the believer. This meant that faith and obedience aren't the ground for justification (in terms of an actual sin/righteousness exchange), but rather the condition to be met to have the satisfaction applied to you personally.

      This is where the anxiety arises. Most reformed teaching depends on something extrinsic from yourself for salvation, but Baxter relocates it into the act of faith itself. It's the faith and faithful obedience of the believer that God looks to and is satisfied.

      The trouble then is with the self-evaluation of faith. The practical effect of this theology is to create a sort of spiritual navel-gazing--constantly trying to determine if one's faith is of a sufficient character to satisfy God, and without any objective measuring stick against which to measure, no determination can be made. 

      For myself, this was where I was before I adopted a stricter Calvinist frame to try to ease my anxiety, but what I found instead was that the question shifted from "is my faith good enough" to "am I elect". It wouldn't be until decades later that I finally realized that the root was the injection of retributive justice into the character of God. 
- id: NEW
  camp: govt
  node:
    title: New Divinity (18th-19th c.)
    desc:
    - Turns justice into moral government
  card:
    title: The New Divinity
    meta: Bellamy, Edwards Jr., Park · 18th–19th c.
    headline: Turns justice into moral government
    problem: |-
      Grotius's rectoral sketch was suggestive but loosely defined, and Edwardsean Calvinists needed it to fit a theology centered on God's benevolent aim for the whole moral universe.
    solution: |-
      They redefine divine justice as general rectitude — God's disposition to do what best serves the moral system. The atonement upholds moral government and makes pardon safe, rather than discharging a retributive debt.
    opens: |-
      Recasting justice as benevolent rectitude arguably changes the subject: it strains to hold the biblical language of wrath and desert, and loosens the tie between the atonement and any individual's guilt even further.
- id: KANT
  camp: moralexemplar
  node:
    title: Kant · Religion within the Bounds of Bare Reason (1793)
    desc:
    - Retreats to Moral Exemplar
  card:
    title: Immanuel Kant
    meta: Religion within the Bounds of Bare Reason, 1793
    headline: Moves atonement inside the moral self
    problem: |-
      Moral guilt looks like the most personal thing a person has — not a fungible liability you can sign over to another — so any scheme that transfers desert seems morally incoherent from the start.
    solution: |-
      He internalizes the atonement: what reconciles is the sinner's own moral revolution, the new self bearing the cost of putting the old self to death, rather than the legal crediting of someone else's merit.
    opens: |-
      If atonement just is the sinner's own moral reform, nothing is really received from outside — grace, Christ's work, and forgiveness turn symbolic, and the guilt of past sin that reform can't retroactively undo is left unpaid.
    notes: |-
      Kant's move here is similar to Grotius's move. Where Grotius moves towards the crucifixion being a relatively non-effectual example of God's retributive justice, Kant bends it towards love. The pair of them then show what happens when PSA collapses in on itself. PSA tried to introduce retributive justice as an attribute of God alongside his love, and where Socinus pushed down on the meaning of retribution and the mathematical impossibility of calling satisfaction forgiveness, two new atonement models emerged, splitting along the two central attributes of God: love and retributive justice.

      The trouble here of course, is that one of these attributes is a fiction. To try to shove it into the frame is to force a split *somewhere* in the system. 
      
      Grotius fell on the side of satisfaction. Kant fell on the side of love.

      Both views render the crucifixion to nothing more than a good example to follow. 
- id: CAM
  camp: onto
  node:
    title: Campbell (1856)
    desc:
    - Replaces penalty with vicarious repentance
    - Rejects the question of the Puritans, not the answer.
  card:
    title: John McLeod Campbell
    meta: The Nature of the Atonement, 1856
    headline: Replaces penalty with vicarious repentance
    problem: |-
      Grant (rightly) that punishment can't be transferred and penal substitution collapses — yet simply dropping objectivity, the Socinian route, throws away the real God-ward reality of the cross.
    solution: |-
      He relocates Christ's offering from penalty to confession: a perfect vicarious 'Amen' to the Father's judgment on sin, an adequate repentance humanity couldn't make — keeping atonement objective without transferring guilt.
    opens: |-
      It's unclear whether confession and repentance can bear the objective, Godward weight that penalty carried — either an adequate answer to condemnation quietly smuggles the penal element back in, or it leaves the wrath data unaddressed.
    notes: |-
      Campbell identifies the core problem with the Puritans in the very question they were trying to answer. He claims that their question, "what must be done to make God able to forgive?", is already off to a bad start because it treats the atonement as the cause of God's love and not the form of God's love. 

      So for him, the atonement is the manifestation of a loving forgiveness that already exists, not a method of acquisition thereof. 

      So he denies that the atonement is a mechanism at all. Instead, it's the person of Christ being who he now eternally is--God and man in one person. He is in the condition of God, and he is also in the condition of man, and it's this link, like the link of a chain, that binds men to God. 

      This is why he's considered in the ontological camp. The atonement *is* Jesus Christ, son of God and son of man. It's not merely the act on the cross bolted onto a life of teaching. Campbell therefore holds an Athanasian view of the incarnation. 
- id: TOR
  camp: onto
  node:
    title: T. F. Torrance (20th c.)
    desc:
    - Grounds salvation in Christ's vicarious humanity.
    - There is no hidden God behind Jesus.
  card:
    title: T. F. Torrance
    meta: 20th c. · after Athanasius & Campbell
    headline: Grounds salvation in Christ's vicarious humanity
    problem: |-
      A purely forensic, transactional atonement leaves God's act external to us, and struggles to show how the cross actually heals human nature or reveals a God who isn't at war with himself.
    solution: |-
      He grounds salvation in Christ's vicarious humanity: the Son believes, obeys, and dies in our place and on our behalf from inside our fallen nature — so atonement is ontological union and healing, not a legal exchange with an angry Father.
    opens: |-
      Critics charge that the ontological account under-accounts for the forensic and wrath-laden texts, buying its coherence by relocating that data rather than explaining it — and assuming fallen humanity raises its own worries about Christ.
    notes: |-
      Torrance takes the work of Campbell and pushes in the point that there's no hidden God behind Jesus. Who we see in Jesus is who God is; full stop. Where Campbell had is "vicarious repentance", Torrance expands this to vicarious humanity. Federal theology had turned God's covenant into God's contract, and Torrance explicitly rejected this move. 

      More than this, Torrance claimed that Christ assumed *fallen* humanity, and sanctified it in the process. We can see some evidence of this in the miracles of Jesus, and how encounters with him resulted in healing, when according to Jewish law, it should have made Christ himself unclean. Healing flows from the Word of God through to humanity, so Torrance was big on union with Christ. 

      There was a brief period of time when I would have said I was a Christian Universalist (a la Robin Parry and David Bentley Hart). After having moved towards an Athanasian frame, while universal salvation is now a possibility (unlike in the PSA frame), it's no longer as important to me (though I certainly hope that all will be saved, and I think I have good reason from 1 Timothy 2:3-4). Torrance rejects limited atonement, but simultaneously rejects universalism on the basis that both are symptoms of the same disease: reasoning about grace by external logical necessity. 
- id: UNIV
  camp: target
  node:
    title: Universal redemption (1646)
    desc:
    - Christ died for all alike
  card:
    title: Universal redemption
    meta: Arminian 'general ransom' · Thomas More, 1646
    headline: Christ died for all alike
    problem: |-
      Scripture repeatedly says Christ died for 'all' and for 'the world,' and a gospel freely offered to everyone seems to require that he actually died for everyone — otherwise the universal call rings hollow.
    solution: |-
      It affirms a general ransom: Christ's death is a universal provision for all people, its saving benefit becoming effective on the condition of faith. (The milder 'hypothetical universalist' variant says the death is sufficient for all but efficient only for the elect.)
    opens: |-
      If Christ actually bore the full penalty for everyone, then either all must be saved or God punishes the same sin twice in those who still perish — the exact vulnerability Death of Death was written to exploit.
- id: OWE47
  camp: penal
  node:
    title: Owen · Death of Death (1647)
    desc:
    - Introduces limited atonement
  card:
    title: Death of Death in the Death of Christ
    meta: John Owen, 1647
    headline: Introduces limited atonement
    problem: |-
      If Christ actually bore the full penalty for everyone, then either everyone must be saved or God punishes the same sin twice — so a blankly universal atonement seems to prove too much.
    solution: |-
      He argues the atonement is definite: Christ died to actually secure, not merely make possible, the salvation of the elect. The double-payment logic says God can't justly exact the debt from both Christ and the sinner.
    opens: |-
      The double-payment argument quietly runs on a money-debt model where payment auto-discharges, which invites Socinus's 'then grace is merely owed' retort — and it still leaves justice a free decree, so the cross's necessity isn't yet secured.

      This also opens the double-predestination charge. God, prior to creation must have destined some to be elect, which by privation destines some to be reprobate. This lands the charge that God created some people for damnation. 
    notes: |-
      This is a "balance the books" answer to try to prevent the double-payment option. It runs on the assumption that there's a constraint within the system between God and man that requires the books to be balanced in the first place, and with double-payment, the books are unbalanced and man pays too much. 
      
      This is assuming that man, who is completely dependent upon the goodness of God for continued existence, has something of value that he God cannot source elsewhere. I fail to see how this doesn't question the infinite nature of God himself. 
- id: OWE53
  camp: penal
  node:
    title: Owen · Dissertation on Divine Justice (1653)
    desc:
    - Makes retributive justice a necessity by 
    - relocating it from God's will to God's 
    - character.
  card:
    title: A Dissertation on Divine Justice
    meta: John Owen, 1653
    headline: Makes justice a necessity, not a choice
    problem: |-
      Grotius — and Owen's own earlier self — treated retributive justice as something God could waive by will. If that's true, God could have forgiven with no satisfaction at all, and the cross loses its necessity.
    solution: |-
      He argues vindicatory justice is an essential attribute of God's nature, not a free choice: God can no more leave sin unpunished than deny himself. Satisfaction becomes strictly necessary, and no rectoral 'relaxation' is available.
    opens: |-
      Making satisfaction strictly necessary revives Socinus's dilemma at full strength: if the penalty is rigorously exacted in full, where is there any room left for grace and forgiveness?
    notes: |-
      Like Owen, most modern proponents of penal substitution say that God is required punish the sinner because justice is part of his character. To this I would ask what kind of justice. There are two: retributive and restorative. Restorative could arguably be considered an artifact of the Trinity, as the Trinity could be thought of as continually restoring one other, flowing from the inherent infinity of love within Godhead between it's members. That said, it sits better as the outworking of love when faced with privation, and by extension, sin.

      The trouble with retributive justice, though, is that it has an innate existential dependency on guilt. Take away guilt, and retributive justice doesn't appear. God can never apply retributive justice to himself on account of perfect love. Because God is eternal, unchanging, and fully actual (according to classical theism), then the quality of retribution introduces a potentiality into the very character of God that could never be actualized among the members of the Trinity. In other words, it's unnecessary to God in the pre-fall universe, but necessary in the post-fall universe. This introduces potentiality which, when actualized, is mutability. A cruder way to put this would be that we broke God when we sinned.
- id: TUR
  camp: penal
  node:
    title: Turretin · Institutes of Elenctic Theology
    desc:
    - Splits God's attributes into habits and acts
  card:
    title: Francis Turretin
    meta: Institutes of Elenctic Theology, 1679-85 · after Owen
    headline: |-
      Punitive justice is essential to God, not a free act of will. What is free is only its exercise — which is what lets a substitute stand in.
    problem: |-
      Socinus had argued that punitive justice is merely a free act of God's will — so God could pardon by fiat and the cross was never necessary. If satisfaction isn't anchored in God's nature, the necessity of Christ's death collapses and the whole Reformed doctrine loses its footing.
    solution: |-
      He takes over Owen's thesis from the Dissertation on Divine Justice — that vindicatory justice is a natural, necessary attribute, so God cannot not punish sin — and adds the decisive move: a distinction between the habit and its act. The disposition to punish is necessary; its exercise is free. God must punish sin, yet is free as to when, whom, and by what mode — free, above all, to accept a substitute. Necessity grounds satisfaction; freedom of exercise preserves grace and licenses the transfer to Christ.
    opens: |-
      A disposition that is necessarily present but only contingently exercised smuggles a real potency into a God meant to be pure act — the habit/act split names the potentiality rather than dissolving it. And the more necessity is loaded into the attribute, the more grace must answer to a prior necessity in God — justice ruling mercy — while freedom over the mode lets the penalty fall on the innocent, loosening the guilt-to-penalty tie that made the justice retributive in the first place.
    notes: |-
      This shows more clearly the faultlines in PSA and why it's so difficult to discuss. There are two pieces that are necessary in PSA: the debt on man's side and the need for satisfaction on God's side. Most of Owen's work in this regards is related to finding a way to insert the satisfaction into the system. What Turretin posits here is a very similar retribution-relocation move that Owen makes in Dissertation. Not only this, but he also casts strict limits on how attributes can be exercised. It says God can choose when, whom, and how, but would likely say that God isn't free to decide how badly he's going to punish you, because that would essentially open the charge that God could simply slap our hands.

      They're looking for a place for the retribution to hide, but it will always be found.

      And this is why it's so hard to combat the theory. In an idea space, as theology is, there are plenty of places to try to hide another injected idea, and we see this happening throughout all versions of the theory. Philosophically, this is known as several things: An immunizing strategy or ad-hoc rescue, which adds ever more qualifications to an idea to hedge it against being disproven. The specific move here is called "monster-barring", which is the refinement of hypotheses to rule out nasty counterexamples. The PSA tree is full of monster-barring examples.

      The trouble with PSA isn't that we're hiding retribution in the wrong place on God's side; it's that the goodness and infinity of God makes retribution nonsensical. We should abandon the idea that God is retributive and just admit that God is good and able. Maybe he's asking us to trust that anything we lost will be given to us in spades--just as he said. Maybe a God who can generate quite simply anything from thin air has better ways to set justice right.
- id: OWE55
  camp: penal
  node:
    title: Owen · Vindiciae Evangelicae (1655)
    desc:
    - PSA is penal, not pecuniary.
    - ∴ Substitution is allowed if volunteered.
    - Adds eternal suretyship into godhead.
    - Says that while God must punish,
    - he retains freedom in how and when.
  card:
    title: Vindiciae Evangelicae
    meta: John Owen vs. John Biddle, 1655
    headline: It's not pecuniary, it's penal.
    problem: |-
      Socinus, through the English Socinian Biddle, pressed two blades at once: full payment leaves no room for grace, and guilt cannot be justly transferred onto an innocent substitute.
    solution: |-
      He distinguishes penal from pecuniary satisfaction — penal payment doesn't auto-discharge, so release still waits on God's free act and grace survives — and grounds the transfer in Christ's voluntary suretyship and covenantal union with the elect.
    opens: |-
      The penal move rescues grace but kicks out the pecuniary logic the double-payment case for limited atonement depended on (Baxter's knife) — and the suretyship answer still owes an account of how Christ's work is actually reckoned to the believer.
    notes: |-
      So he moves to penal to preserve God's right to accept a substitute, and he says that it's that move that is essentially the grace of God—that God didn't have to accept a substitute but he does anyway.

      It may also be worth noting that this move subtly re-imports restorative justice. Allowing a substitute for retributive justice provides restoration for another, and thus it's no longer retributive, but restorative, which tends toward's God's retribution being more of a display than anything else and we're moving in Grotius's direction towards Governmental theory.

      The unstated motive of allowing the satisfaction to move via the volunteerism provided by this view is to restore the sinner. That means it quietly shifts from retributive to restorative justice. What's left then is a question of whether the shift maintains the judicial parity between how man pays and how Christ pays (is ECT equivalent to death on a cross?), and it opens the question of sourcing the penalty from the divinity or humanity of Christ.

      The former split devolves into an argument about the infinite value of Christ and how that pays the debt. But the infinite value argument cuts both ways, and includes an infinite God paying himself, thus omitting mankind entirely in the transaction. Moreover, what does payment between infinite co-equals even mean? It's nonsense.

      To say the debt is paid by Christ's humanity requires some kind of infusion of necessary value into a bankrupt mankind in order to provide a value to remit. The only source outside mankind capable of this is God himself, so mankind is merely inserted as a passthrough entity in a greater (probably nonsensical) transaction between God and God.

      Even more than this, what would the suretyship look like amongst the Trinity? Wouldn't this mean that the Son agrees in advance of creation to pay back to the Father what the people owed? Isn't that again another imbalance? What does this mean for immutability?
- id: OWE77
  camp: penal
  node:
    title: Owen · Justification by Faith (1677)
    desc:
    - Closes the system with double imputation
  card:
    title: The Doctrine of Justification by Faith
    meta: John Owen, 1677
    headline: Closes the system with double imputation
    problem: |-
      The suretyship scheme still owes an account of how Christ's work actually counts as the believer's, and how a guilty person comes to stand righteous before God.
    solution: |-
      He closes the forensic circuit with double imputation: the believer's sin is reckoned to Christ and Christ's righteousness reckoned to the believer, received through faith — locking the whole system together.
    opens: |-
      Double imputation invites the legal-fiction charge and rests the whole system on a transactional Father–Son distinction — Christ standing before the Father — that a strong 'to see Jesus is to see the Father' would collapse.
    notes: |-
      This opens another problem, which is that the imputation scheme is really just legal fiction and not something actual--it makes no actual change. To defend, he makes it forensically real (stronger than legal fiction) by basing on union with Christ. Rome says that a verdict only declares the person righteous, but doesn't make them righteous. Torrance says salvation should be an actual, not forensic, change, which pushes the actual change to sanctification--making sanctification, not justification, the actual thing that changes.
- id: RAMSAY
  camp: other
  node:
    title: Ramsay · Models and Mystery (1963)
    desc:
    - Doctrines are disclosures, not blueprints
  card:
    title: Models and Mystery
    meta: Ian Ramsay, 1964
    headline: Doctrines are Disclosure Models
    problem: |-
      Logical positivism had reduced religious statements to nonsense - unverifiable, unfalsifiable, therefore meaningless (Flew's "death by a thousand qualifications"). And taken literally, doctrines like penal substitution collapse into crude, mockable pictures that critics can dismiss as morally monstrous.
    solution: |-
      He recasts theological language as models plus qualifiers anchored in "disclosure situations" — an ordinary word ("substitute," "ransom," "father") pressed by a qualifier until the penny drops and insight breaks. Such models aren't measured by literal resemblance but by fruitfulness, and they come in corrigible pluralities, each correcting the others and pointing past itself to a mystery none contains.
    opens: |-
      Mystery is bought at the price of illogicality.
    notes: |-
      This sets up the ball for Packer.

      It's worth noting that Ramsay's argument was not pointed at PSA directly, but rather at the way in which theological models are used. He suggests that theological atonement models are not much different from models of light and other models in science (especially physics). They help us understand things, but then their further use is limited as they approach the edges of what they can explain.
- id: PACKER
  camp: penal
  node:
    title: Packer · What Did The Cross Achieve? (1973)
    desc:
    - Double down on PSA. Accept the mystery.
  card:
    title: What Did the Cross Achieve?
    meta: J.I. Packer, 1973
    headline: PSA as the central atonement theory.
    problem: |-
      General resistance to the doctrine of penal substitutionary atonement.
    solution: "Packer's paper essentially doubled down on the importance of penal substitutionary atonement by claiming that it is the best possible model we have. \n\nWhile supporting the Puritans, he simultaneously critiques the rationalism of the Puritans, claiming that they left no room for mystery, and shouldn't have thought about it too deeply. \n\nHe also rejected the common caricature of PSA as being \"cosmic child abuse\"."
    opens: |-
      Packer abandons reason. By arguing that the Puritans were overly rationalistic in their claims, his conclusion is not that they started with poor premises, but rather that they should have left the mechanisms open to mystery.
    notes: |-
      To me this is a concession. Anselm, Calvin, Owen, Baxter, and many theologians before them had spent centuries trying to smuggle retributive justice into Christianity without providing a satisfying logic. The model was apparently illogical. Faced with a model that resists attempts to apply logic, one can either reject the model or reject the logic. Packer takes a note from Ramsay and suggests the latter.

      Packer's solution (which he draws from Ramsay) is to claim that the model has it's limits, but is still the best model out there. To me, it's essentially throwing up his hands and saying it's a mystery. I find this explanation unsatisfactory.

      More than this, this also marks a point at which Packer is now playing on different rules than those who created the doctrine. From Packer's perspective, Owen and others were misled by their attempts to use logical positivism to prove the point. The trouble with this is that the entirety of the model was built using similar methods of classical logic. Responses were framed as correctives to previous statements, often based in logic. By claiming that the models are merely tools used for disclosure and not blueprints is denying the foundation upon which they were built.

      One other problem that I have with this argument is that Packer likely wouldn't hold the same level of latitude towards other atonement models. Indeed, in the very same year he wrote this paper, he criticizes C.H. Dodd for trying to reduce propitiation to "expiation", which is effectively an attack on another model.
extra_cards:
- id: MORT01
  camp: other
  card:
    title: Divine Infinity and Simplicity Eliminates Transaction
    meta: Unattributed Idea
    headline: Transactions are fiction within an infinite and unified godhead
    problem: |-
      The whole of the Owen system relies on the redemption-as-covenant framework, which is fiction because in it, the suretyship means that God owes God--a closed transaction. Also, a meaningful, non-symbolic transaction between the person of the Godhead creates a necessary imbalance. For a payment to happen, one party increases as the other decreases, and this leads to heresy.
    solution: |-
      Reject PSA. Return to ontological/therapeutic frameworks. Abandon annihilationism and eternal conscious torment and reestablish corruption.
    opens: |-
      The cost moves to the assumed flesh.
    notes: |-
      The classical rebuttal answers this by relocating the payment for the penalty to the human frame. When we do so, we run into another (kind of athanasian) problem. Once relocated, then we have to provide some way for the human frame to have sufficient value to repay. The best approach for this is in the deification of the body on the basis of The Word's infinite nature, and that brings us full circle back to Athanasius. If Christ's body deifies his human flesh in such a way that it can bear the penalty and be resurrected, then why can't he deify all human flesh (ontological)?
- id: MORT02
  camp: other
  card:
    title: Infuse mankind with deified dignity to meet the demand.
    meta: Unattributed Idea
    headline: Returns to the Athanasian model.
    problem: |-
      Human flesh lacks the sufficiency to satisfy the demands of God.
    solution: |-
      Infuse humanity with something that is sufficient to pay the penalty. This is something that had to preexist before God's death.
    opens: |-
      The problem that PSA isn't really PSA anymore. It's the movement of a debt from man to God and then back to man again for payment. Man becomes nothing more than a pass-through entity.
- id: MORT03
  camp: other
  card:
    title: Move the source of payment to human flesh.
    meta: Unattributed Idea
    headline: The payment comes from man, not from God.
    problem: |-
      The fact that an intra-trinitarian payment is nonsensical means that the payment must come from somewhere else.
    solution: |-
      The answer is found in Chalcedonian tradition of God's impassibility. Because God is immutable and cannot be harmed by his creatures, then the repayment must be drawn from man's account and not God's.
    opens: |-
      Humanity lacks the inherent value necessary to satisfy the demand.
