title: Atonement Theory Family Tree
# The "how to read this chart" modal.
#   never       — only opens via the "?" button (default)
#   first_visit — also open automatically the first time someone loads the map
#   always      — open on every page load
#
# This defaults to `never` now that the landing page does the introducing.
# Opening a modal over the map on arrival puts a wall in front of the thing
# people clicked through to see.
about:
  show_on_load: never
# ---------------------------------------------------------------------------
# Nodes. One file per position, loaded in the order listed below.
#
# ORDER MATTERS: it's the order the boxes are declared in the flowchart, which
# influences how Mermaid ranks and places them. Reordering here reshuffles the
# diagram; it is not just cosmetic.
#
# A file with a `node:` block becomes a box on the diagram. A file with only a
# `card:` block is a card with no box (reachable only from a link, like the
# unattributed ideas below) — so adding a `node:` block promotes it onto the map.
# ---------------------------------------------------------------------------
node_files:
- nodes/origen.yaml
- nodes/irenaeus.yaml
- nodes/anselm.yaml
- nodes/athanasius.yaml
- nodes/luther.yaml
- nodes/calvin.yaml
- nodes/socinus.yaml
- nodes/grotius.yaml
- nodes/baxter.yaml
- nodes/new-divinity.yaml
- nodes/kant.yaml
- nodes/campbell.yaml
- nodes/torrance.yaml
- nodes/universal-redemption.yaml
- nodes/owen-1647-death-of-death.yaml
- nodes/owen-1653-divine-justice.yaml
- nodes/turretin.yaml
- nodes/owen-1655-vindiciae.yaml
- nodes/owen-1677-justification.yaml
- nodes/ramsay.yaml
- nodes/packer.yaml

# Cards without a box on the diagram
- nodes/idea-infinity-eliminates-transaction.yaml
- nodes/idea-deified-dignity.yaml
- nodes/idea-payment-from-flesh.yaml

# ---------------------------------------------------------------------------
