# Divine Infinity and Simplicity Eliminates Transaction
# Loaded via the node_files manifest in ../content.yaml
id: MORT01
camp: other
card:
  title: Divine Infinity and Simplicity Eliminates Transaction
  meta: Unattributed Idea
  headline: Transactions are fiction within an infinite and unified godhead
  problem: |-
    The whole of the Owen system relies on the redemption-as-covenant framework, which is fiction because in it, the suretyship means that God owes God--a closed transaction. Also, a meaningful, non-symbolic transaction between the person of the Godhead creates a necessary imbalance. For a payment to happen, one party increases as the other decreases, and this leads to heresy.
  solution: |-
    Reject PSA. Return to ontological/therapeutic frameworks. Abandon annihilationism and eternal conscious torment and reestablish corruption.
  opens: |-
    The cost moves to the assumed flesh.
  notes: |-
    The classical rebuttal answers this by relocating the payment for the penalty to the human frame. When we do so, we run into another (kind of athanasian) problem. Once relocated, then we have to provide some way for the human frame to have sufficient value to repay. The best approach for this is in the deification of the body on the basis of The Word's infinite nature, and that brings us full circle back to Athanasius. If Christ's body deifies his human flesh in such a way that it can bear the penalty and be resurrected, then why can't he deify all human flesh (ontological)?
