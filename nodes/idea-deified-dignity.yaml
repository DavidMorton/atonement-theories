card:
  title: Infuse mankind with deified dignity to meet the demand.
  meta: Unattributed Idea
  headline: Returns to the Athanasian model.
  problem: |-
    Human flesh lacks the sufficiency to satisfy the demands of God.
  solution: |-
    Infuse humanity with something that is sufficient to pay the penalty. This is something that had to preexist before God's death.
  opens: |-
    The problem that PSA isn't really PSA anymore. It's the movement of a debt from man to God and then back to man again for payment. Man becomes nothing more than a pass-through entity.
