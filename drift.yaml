# ---------------------------------------------------------------------------
# The Migration of the Claim — content and geometry for /drift/.
#
# Coordinates are fractions of the plotting field (0..1). x runs outward ->
# inward; y runs top -> bottom, so lower y = stronger bind on God.
#
# Three phases, each with its own visual logic:
#   relocation — positions travel through a space; points and a trail
#   fission    — the space IS God; no points, only cuts and shading
#   mystery    — the field flattens to a line
#
# Axis labels are per-phase and all four are optional. `axis_left` and
# `axis_right` sit under the field at its two ends; `axis_top` and
# `axis_bottom` do the same for the y axis, rotated up the left-hand side.
# Each is anchored at its own end and runs back toward the middle, so a long
# label grows inward across the field rather than off the edge. Omit any of
# them and nothing is drawn — phases whose axes don't measure anything (the
# cuts in `fission` are geometry, not a scale) should leave them out.
#
# To add a step: add an entry under the right phase's `steps:`. To change the
# geometry of a cut, edit its `cut:` and `live:` blocks. Nothing else moves.
# ---------------------------------------------------------------------------
title: The Migration of the Claim
tagline: >-
  Every increase in what is claimed over God drives the claim further inward,
  until it is held by God against God.
eyebrow: an argument, not a survey

phases:

  # =========================================================================
  # x is where the claim is kept, running from wholly outside God to the
  # divine essence. y is how hard it binds — the modality column of the essay's
  # station table, absolute at the top, no claim on God at all at the bottom.
  #
  # The two axes do not move together, and the chart should not pretend they
  # do. Location trends inward; modality, in the essay's phrase, turns
  # constantly. Hence the two reversals below, both of which the essay asserts
  # outright: patristic ransom takes the claim back outside God while making it
  # absolute, and Owen 1647 is marked *retrograde* — a step back out to the
  # will before 1653 goes all the way in.
  #
  # `binds` selects how a point is drawn: `god`, `creature`, or `unstated` for
  # a position that declines to fix its modality. There is exactly one of the
  # last, and it is load-bearing rather than an oversight — see Calvin.
  - id: relocation
    numeral: I
    name: relocation
    axis_left: outside God
    axis_right: in God
    axis_top: God is constrained
    axis_bottom: God is free
    # the edge of God, and the edge of his essence
    guides: [0.28, 0.78]
    steps:

      - id: none
        head: Nothing to keep
        date: De Incarnatione · the better line
        note: >-
          Corruption follows sin the way cold follows the removal of heat: a fact about creatures, not a sentence imposed from outside. Nothing here binds God. This is the account Athanasius already has, before the dilemma a few pages later claimed he put a constraint on himself.
        points:
          - {x: 0.05, y: 0.96, binds: creature}

      - id: veracity
        head: God's own word binds him
        date: 4th c. · Athanasius, the divine dilemma
        note: >-
          God says Adam and Eve will die, and God is bound by truth to his statement and *must* ensure it happens. God is bound to his promise — but only because his free utterance put it there. Costing little - This is the seed of everything after it.
        points:
          - {x: 0.05, y: 0.96, binds: creature}
          - {x: 0.40, y: 0.72, binds: god}

      - id: adversary
        head: A third party holds it
        date: 3rd c. · patristic ransom
        note: >-
          The claim leaves God, moving from his utterance about death and to the devil instead. The devil holds us ransom and our only hope is if God pays the ransom price. It binds only if the devil can hold a right against God.
        points:
          - {x: 0.05, y: 0.96, binds: creature}
          - {x: 0.40, y: 0.72, binds: god}
          - {x: 0.16, y: 0.30, binds: god}

      - id: honour
        head: Wounded honour
        date: 1098 · Anselm
        note: >-
          But the devil has no claim over his creator. Man's error is now his violation of the moral order and the offense that is to God's honour. Christ volunteers, reaps a surplus reward, and gifts it to men. Triggered but not absolute, as God can use his discretion in application of punishment.
        points:
          - {x: 0.05, y: 0.96, binds: creature}
          - {x: 0.40, y: 0.72, binds: god}
          - {x: 0.16, y: 0.30, binds: god}
          - {x: 0.34, y: 0.66, binds: god}

      - id: justice
        head: Justice, on unstated terms
        date: 1559 · Calvin
        note: >-
          But if God can use his discretion, then our good works could contribute somehow. That's works, not faith. So he picks a more objective trait - justice - and applies a penal frame. The payment, which was a reward for Anselm becomes a punishment for Calvin, and Jesus pays it. Calvin declines to say if God's hand is forced.
        points:
          - {x: 0.05, y: 0.96, binds: creature}
          - {x: 0.40, y: 0.72, binds: god}
          - {x: 0.16, y: 0.30, binds: god}
          - {x: 0.34, y: 0.66, binds: god}
          - {x: 0.52, y: 0.50, binds: unstated}

      - id: decree
        head: Into the will of God
        date: 1647 · Owen, The Death of Death
        note: >-
          Now that the payment is a punishment and not a gift, two things are required: proportionality and no overpayment. Owen balances the books. For the moment, Owen is firm that the whole system relies in God's will, and thus his discretion. This doesn't last long.
        points:
          - {x: 0.05, y: 0.96, binds: creature}
          - {x: 0.40, y: 0.72, binds: god}
          - {x: 0.16, y: 0.30, binds: god}
          - {x: 0.34, y: 0.66, binds: god}
          - {x: 0.52, y: 0.50, binds: unstated}
          - {x: 0.46, y: 0.70, binds: god}

      - id: essence
        head: The interior is reached
        date: 1653 · Owen reverses himself
        note: >-
          The universalists point out that if it's God's will then God could just forgive. No payment needed. To Owen, that empties the cross of value. To solve this, Owen relocates retributive justice from God's will to his essence. God can now no more leave sin unpunished than deny himself. God cannot not punish sin. Five major moves and the requirement is embedded in God himself.
        points:
          - {x: 0.05, y: 0.96, binds: creature}
          - {x: 0.40, y: 0.72, binds: god}
          - {x: 0.16, y: 0.30, binds: god}
          - {x: 0.34, y: 0.66, binds: god}
          - {x: 0.52, y: 0.50, binds: unstated}
          - {x: 0.46, y: 0.70, binds: god}
          - {x: 0.92, y: 0.10, binds: god}

  # =========================================================================
  - id: fission
    numeral: II
    name: fission
    caption: shaded — what still carries the claim
    steps:

      - id: undivided
        head: The interior, undivided
        date: from 1578 · under Socinian pressure
        note: >-
          It's part of God's nature that he punish justice, but the mechanism is still, as of yet, unspecified. Where the past steps have been made to ensure God's sovereignty, the next ones will be made to explain how such a creature-centric attribute could exist within an eternal and immutable God.
        live: {x0: 0.0, x1: 1.0, y0: 0.0, y1: 1.0}
        # Where the previous phase left the claim — keep this in step with the
        # last point of `relocation`. `bloom` grows that point out to fill the
        # live region instead of cutting to it, so the handover from travelling
        # to filling is one motion rather than two pictures.
        bloom: {x: 0.92, y: 0.10}

      - id: father-son
        head: God contracts with God
        date: c. 1648 · Dickson · Cocceius · the pactum
        note: >-
          Around this time, the federal theologians propose an eternal covenant: an agreement between the Father and the Son that was made before creation. Christ stands as surety for the world, offering to take the punishment of a not-yet-created mankind. Wholly interior now, and still freely made — then binding. The only parties left who can transact are the divine persons themselves.
        cut:  {orient: h, at: 0.5, from: 0.0, to: 1.0}
        live: {x0: 0.0, x1: 1.0, y0: 0.0, y1: 0.5}
        labels:
          - {text: father, x: 0.5, y: 0.28, live: true}
          - {text: son,    x: 0.5, y: 0.78}

      - id: will-essence
        head: Will, or essence
        date: 1653 · the same reversal, seen from inside
        note: >-
          Is the claim held by what God wants, or by what God is? Owen crossed that line in six years. Everything left out of it is now conceded ground — releasable, and therefore useless to the argument. Technically, this is the whole Trinity, but perception tends towards Father/Son temperament differences here.
        cut:  {orient: v, at: 0.5, from: 0.0, to: 0.5}
        live: {x0: 0.5, x1: 1.0, y0: 0.0, y1: 0.5}
        labels:
          - {text: son,     x: 0.5,  y: 0.78}
          - {text: will,    x: 0.25, y: 0.28}
          - {text: essence, x: 0.75, y: 0.28, live: true}

      - id: mode-fact
        head: The fact, or the mode
        date: 1655 · Owen, Vindiciae Evangelicae
        note: >-
          The necessity itself is bisected. That sin is punished is necessary;
          when, on whom and how is free. This is exactly what licenses
          accepting a substitute — and it hands the mode back to the will, so
          one attribute now runs under two modalities at once.
        cut:  {orient: h, at: 0.25, from: 0.5, to: 1.0}
        live: {x0: 0.5, x1: 1.0, y0: 0.0, y1: 0.25}
        labels:
          - {text: son,  x: 0.5,  y: 0.78}
          - {text: will, x: 0.25, y: 0.28}
          - {text: mode, x: 0.75, y: 0.40, small: true}
          - {text: fact, x: 0.75, y: 0.14, small: true, live: true}

      - id: habitus-actus
        head: Held, or exercised
        date: 1679 · Turretin, Institutio
        note: >-
          The attribute itself is bisected: habitus, the disposition, is
          necessary; actus, its exercise, is free. Habitus is the defensible
          cell, actus is what gets preached. The potency the whole move was
          meant to avoid is now named rather than removed.
        cut:  {orient: v, at: 0.75, from: 0.0, to: 0.25}
        live: {x0: 0.75, x1: 1.0, y0: 0.0, y1: 0.25}
        outline:
          rect: {x0: 0.5, x1: 0.75, y0: 0.0, y1: 0.25}
          label: preached
          label_at: {x: 0.625, y: 0.21}
        labels:
          - {text: son,     x: 0.5,   y: 0.78}
          - {text: will,    x: 0.25,  y: 0.28}
          - {text: mode,    x: 0.75,  y: 0.40, small: true}
          - {text: actus,   x: 0.625, y: 0.13, small: true}
          - {text: habitus, x: 0.875, y: 0.13, small: true, live: true}

  # =========================================================================
  - id: mystery
    numeral: III
    name: mystery
    steps:
      - id: packer
        head: Locus abandoned, bind retained
        date: 1973 · Packer
        note: >-
          That the claim binds is required. Where it is held becomes optional —
          placed under mystery and left unanswered. The territory goes to zero
          and the square flattens into the one line the argument actually
          needs. This is not a new move. It is the limit of every cut before
          it. It seems that retribution dissolves to nothing in the presence of the trinity.
        collapse:
          at: 0.13
          label: the bind, without a ground
          glyph: '?'
          glyph_at: {x: 0.5, y: 0.72}
