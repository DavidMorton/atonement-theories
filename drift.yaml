# ---------------------------------------------------------------------------
# The Migration of the Claim — content and geometry for /drift/.
#
# Coordinates are fractions of the plotting field (0..1). x runs outward ->
# inward; y runs top -> bottom, so lower y = stronger bind on God.
#
# Three phases, each with its own visual logic:
#   relocation — positions travel through a space; points and a trail
#   fission    — the space IS God; no points, only cuts and shading
#   mystery    — the field flattens to a line
#
# Axis labels are per-phase and all four are optional. `axis_left` and
# `axis_right` sit under the field at its two ends; `axis_top` and
# `axis_bottom` do the same for the y axis, rotated up the left-hand side.
# Each is anchored at its own end and runs back toward the middle, so a long
# label grows inward across the field rather than off the edge. Omit any of
# them and nothing is drawn — phases whose axes don't measure anything (the
# cuts in `fission` are geometry, not a scale) should leave them out.
#
# To add a step: add an entry under the right phase's `steps:`. To change the
# geometry of a cut, edit its `cut:` and `live:` blocks. Nothing else moves.
#
# Every `note:`, and the `body:` of the intro and outro below, is markdown —
# *italics*, **bold**, links, lists, > quotes. build.py renders it at build
# time, so the page ships no parser. Use `|` (not `>-`) for anything with
# blank lines or list items in it, so the line breaks survive YAML folding.
# ---------------------------------------------------------------------------
title: The Migration of the Claim
tagline: >-
  Every increase in what is claimed over God drives the claim further inward,
  until it is held by God against God.
eyebrow: an argument, not a survey

# ---------------------------------------------------------------------------
# Optional opening and closing screens. Either can be deleted outright and the
# page simply starts on the first step and ends on the last. While one is up
# the diagram stands down and the whole middle of the page is prose.
#
#   head:  the headline, where a step's `head` goes
#   date:  the small line under it — a kicker, not necessarily a date
#   body:  markdown
#   cta:   label for the forward button (defaults to "next →")
#   back:  label for the back button (defaults to "← back")
#   links: optional buttons at the foot of the screen; site-relative hrefs
#          get the baseurl added, absolute ones are left alone
# ---------------------------------------------------------------------------
intro:
  head: Before the first move
  date: how to read this
  cta: begin →
  body: |
    **Why does God *have* to punish sin?**

    What follows is one claim, tracked across sixteen centuries: that God *must* punish sin retributively. Not a survey of atonement theories — an argument about a single thread inside one of them.

    The field is a map with two axes. Left to right is **where the compulsion is kept**, from wholly outside God to the divine essence itself. Top to bottom is **how hard it binds** — absolute at the top, no claim on God at all at the bottom.

    Watch the two axes come apart as theology develops. Each answer to an objection moves the claim further in; and once it is inside, the only room left to move is to divide God.

phases:

  # =========================================================================
  # x is where the claim is kept, running from wholly outside God to the
  # divine essence. y is how hard it binds — the modality column of the essay's
  # station table, absolute at the top, no claim on God at all at the bottom.
  #
  # The two axes do not move together, and the chart should not pretend they
  # do. Location trends inward; modality, in the essay's phrase, turns
  # constantly. Hence the two reversals below, both of which the essay asserts
  # outright: patristic ransom takes the claim back outside God while making it
  # absolute, and Owen 1647 is marked *retrograde* — a step back out to the
  # will before 1653 goes all the way in.
  #
  # `binds` selects how a point is drawn: `god`, `creature`, or `unstated` for
  # a position that declines to fix its modality. There is exactly one of the
  # last, and it is load-bearing rather than an oversight — see Calvin.
  - id: relocation
    numeral: I
    name: relocation
    axis_left: outside God
    axis_right: inside God
    axis_top: God is constrained
    axis_bottom: God is free
    # the edge of God, and the edge of his essence
    guides: [0.28, 0.72]
    steps:

      - id: none
        head: Nothing to keep
        date: De Incarnatione · the better line
        note: >-
          Corruption follows sin the way cold follows the removal of heat: a fact about creatures, not a sentence imposed from outside. Nothing here binds God. This is the account Athanasius already has, before the dilemma a few pages later claimed he put a constraint on himself.
        points:
          - {x: 0.05, y: 0.96, binds: creature}

      - id: veracity
        head: God's own word binds him
        date: 4th c. · Athanasius, the divine dilemma
        note: >-
          In those later pages, God says Adam and Eve will die, and God is bound by truth to his statement and *must* ensure it happens. God is bound to his promise — but only because his free utterance put it there. Costing little - This is the seed of everything after it.
        points:
          - {x: 0.05, y: 0.96, binds: creature}
          - {x: 0.40, y: 0.72, binds: god}

      - id: adversary
        head: A third party holds it
        date: 3rd c. · patristic ransom
        note: >-
          The claim on man leaves God, moving from his utterance about death and to the devil instead. The devil holds us ransom and our only hope is if God pays the ransom price. It binds only if the devil can hold a right against God.
        points:
          - {x: 0.05, y: 0.96, binds: creature}
          - {x: 0.40, y: 0.72, binds: god}
          - {x: 0.16, y: 0.30, binds: god}

      - id: honour
        head: Wounded honour
        date: 1098 · Anselm
        note: >-
          But the devil has no claim over his creator. Man's error is now his violation of the moral order and the offense that is to God's honour. Christ volunteers, reaps a surplus reward, and gifts it to men. Triggered but not absolute, as God can use his discretion in who receives the gift.
        points:
          - {x: 0.05, y: 0.96, binds: creature}
          - {x: 0.40, y: 0.72, binds: god}
          - {x: 0.16, y: 0.30, binds: god}
          - {x: 0.34, y: 0.66, binds: god}

      - id: justice
        head: Justice, on unstated terms
        date: 1559 · Calvin
        note: >-
          But if it's God honour that is offended, then honour can be compensated for by gifts - and Rome's indulgences. That's works, not faith. So he picks a more objective trait - justice - and applies a penal frame. The payment, which was a reward for Anselm becomes a punishment for Calvin, and Jesus pays it. Calvin declines to say if God's hand is forced.
        points:
          - {x: 0.05, y: 0.96, binds: creature}
          - {x: 0.40, y: 0.72, binds: god}
          - {x: 0.16, y: 0.30, binds: god}
          - {x: 0.34, y: 0.66, binds: god}
          - {x: 0.52, y: 0.50, binds: unstated}
  

      - id: decree
        head: Into the will of God
        date: 1647 · Owen, The Death of Death
        note: >-
          The need to punish wrong retributively moves to the will of God. Justice requires balance — the same debt cannot be exacted twice. An arithmetic constraint binds an infinite being. Five major moves, and there's nowhere left to go that isn't a division of the godhead itself.
        points:
          - {x: 0.05, y: 0.96, binds: creature}
          - {x: 0.40, y: 0.72, binds: god}
          - {x: 0.16, y: 0.30, binds: god}
          - {x: 0.34, y: 0.66, binds: god}
          - {x: 0.52, y: 0.50, binds: unstated}
          - {x: 0.88, y: 0.19, binds: god}

  # =========================================================================
  - id: fission
    numeral: II
    name: fission
    caption: shaded — what still carries the claim
    steps:

      - id: undivided
        head: The interior, undivided
        date: 1647 · Owen, The Death of Death
        note: >-
          It's now part of God's nature that he must punish justice, but the mechanism is still unspecified. Where the past steps have been made to ensure God's sovereignty, the next ones will be made to explain how a predisposition dependent on man's guilt could possibly exist within an eternal and immutable God.
        live: {x0: 0.0, x1: 1.0, y0: 0.0, y1: 1.0}
        # Where the previous phase left the claim — keep this in step with the
        # last point of `relocation`. `bloom` grows that point out to fill the
        # live region instead of cutting to it, so the handover from travelling
        # to filling is one motion rather than two pictures.
        bloom: {x: 0.88, y: 0.19}

      # An orthogonal division, not a narrowing one: it answers who the parties
      # are, not where the necessity lives, so it crosses the ladder rather than
      # forming a rung of it. `live` is unchanged and `persist` keeps the line
      # drawn faintly under every cut that follows.
      - id: father-son
        head: God contracts with God
        date: c. 1648 · Dickson · Cocceius · the pactum
        note: >-
          The obligation is grounded in a covenant made before time between Father and Son, with Christ standing surety. A freely made, but bindin contract between trinitarian persons. The only parties left to transact are the divine persons themselves.
        overlay:
          line: {x1: 0.0, y1: 0.12, x2: 1.0, y2: 0.88}
          dash: true
          persist: true
          labels:
            - {text: father, x: 0.10, y: 0.06}
            - {text: son,    x: 0.90, y: 0.94}
        live: {x0: 0.0, x1: 1.0, y0: 0.0, y1: 1.0}

      - id: will-essence
        head: Will, or essence
        date: 1653 · Owen reverses himself
        note: >-
          Is the claim held by what God wants, or by who God is? Owen divides God into will and essence. Vindicatory justice is now a natural and necessary attribute: God can no more leave sin unpunished than deny himself. Absolute at last. God is compelled to punish sin retributively. He has no choice. He is not free.
        cut:  {orient: v, at: 0.5, from: 0.0, to: 1.0}
        live: {x0: 0.5, x1: 1.0, y0: 0.0, y1: 1.0}
        labels:
          - {text: will,    x: 0.25, y: 0.5}
          - {text: essence, x: 0.75, y: 0.5, live: true}

      - id: mode-fact
        head: The fact, or the mode
        date: 1655 · Owen, Vindiciae Evangelicae
        note: >-
          Socinus points out that demanding payment is mutually exclusive with forgiveness, and retribution' target cannot be justly transferred. So Owen bisects an essential attribute. *That* sin is punished is fact; when, on whom and how is free, and is the mode. This is what licenses accepting a substitute for retributive justice.
        cut:  {orient: h, at: 0.5, from: 0.5, to: 1.0}
        live: {x0: 0.5, x1: 1.0, y0: 0.0, y1: 0.5}
        labels:
          - {text: will, x: 0.25, y: 0.5}
          - {text: mode, x: 0.75, y: 0.75}
          - {text: fact, x: 0.75, y: 0.25, live: true}

      - id: habitus-actus
        head: Held, or exercised
        date: 1679 · Turretin, Institutio
        note: >-
          Then why don't all get punished immediately with no exceptions? Turretin cuts an attribute itself into habitus (the disposition that requires God punish sin) and actus (which controls the actual firing of it). God is still compelled. This answers the objection, but there's nowhere else to cut. 
        cut:  {orient: v, at: 0.75, from: 0.0, to: 0.5}
        live: {x0: 0.75, x1: 1.0, y0: 0.0, y1: 0.5}
        outline:
          rect: {x0: 0.5, x1: 0.75, y0: 0.0, y1: 0.5}
          # label: preached
          # label_at: {x: 0.625, y: 0.38}
        labels:
          - {text: will,    x: 0.25,  y: 0.5}
          - {text: mode,    x: 0.75,  y: 0.75}
          - {text: actus,   x: 0.625, y: 0.25, small: true}
          - {text: habitus, x: 0.875, y: 0.25, small: true, live: true}

  # =========================================================================
  - id: mystery
    numeral: III
    name: mystery
    steps:
      - id: packer
        head: Locus abandoned, bind retained
        date: 1973 · Packer
        note: >-
          Without any more things to cut or a logical explanation of how the system works, Packer relegates the compulsion's locus to mystery but maintains it's existence. This is the limit of every cut before it. It seems that a compulsion to punish dissolves in the presence of the trinity - but tradition maintains it anyhow.
        collapse:
          at: 0.13
          label: the bind, without a ground
          glyph: '?'
          glyph_at: {x: 0.5, y: 0.72}

# ---------------------------------------------------------------------------
# The closing screen. Same shape as `intro:` above.
# ---------------------------------------------------------------------------
outro:
  head: After the last cut
  date: what the picture shows
  cta: end
  body: |
    Nothing here is a charge of bad faith. Every move was made by someone answering a real objection, and each one works — locally. The trouble is only visible end to end: the answers accumulate into a claim no single author would have made - that God is compulsive and can't resist punishing sin.

    It doesn't have to be that way, though. Maybe God is infinite, and maybe his justice flows out of abundance and not constraint. 

    Maybe God isn't *compelled* to do anything he doesnt want to do. And maybe instead of being retributive, he looks more like Jesus after all.
  links:
    - {text: the simplified essay, href: /start/}
    - {text: the family tree, href: /map/}
